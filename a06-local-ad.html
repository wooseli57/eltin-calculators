<!DOCTYPE html>
<html lang="ko" data-cat="A" data-no="06">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A06 지역광고 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>지역광고 계산기</h1>
      <p>네이버 플레이스·당근 광고 클릭 단가로 필요한 클릭 수와 방문 손님 수를 알려줘요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="field">
      <label for="budget">한 달 광고비</label>
      <div class="input-wrap"><input id="budget" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
      <div class="hint" id="budgetHint"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="cpc">클릭 1번 단가 <small>광고 화면</small></label>
        <div class="input-wrap sm"><input id="cpc" type="text" inputmode="numeric" autocomplete="off" placeholder="직접 입력"><span class="unit">원</span></div>
      </div>
      <div class="field">
        <label for="conv">방문 전환율 <small>클릭 중 방문</small></label>
        <div class="input-wrap sm"><input id="conv" type="text" inputmode="decimal" autocomplete="off" placeholder="직접 입력"><span class="unit">%</span></div>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="ticket">객단가</label>
        <div class="input-wrap sm"><input id="ticket" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="ticketHint"></div>
      </div>
      <div class="field">
        <label for="rate">원가율</label>
        <div class="input-wrap sm"><input id="rate" type="text" inputmode="decimal" autocomplete="off" value="30"><span class="unit">%</span></div>
      </div>
    </div>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== A06 지역광고 계산기 ===== */
/* 클릭 단가·방문 전환율은 근거 있는 기본값이 없어 비워 둠 (calculators.md 메모) */
const CONFIG = { vatRate: 0.10, baseYear: 2026 };
const { $, won, num, moneyInput, numInput, ACTIONS, bindActions, postHeight } = Eltin;

const budget = moneyInput($("#budget"), $("#budgetHint"), render);
const ticket = moneyInput($("#ticket"), $("#ticketHint"), render);
const cpc = numInput($("#cpc"), render), conv = numInput($("#conv"), render), rate = numInput($("#rate"), render);

/* 손님 1명 남는 돈 = 객단가 ÷ (1 + 부가세율) × (1 − 원가율)
   본전 손님 = 광고비 ÷ 손님 1명 남는 돈, 본전 클릭 = 본전 손님 ÷ 전환율 */
function render(){
  const b = budget.value, t = ticket.value, r = rate.value, c = cpc.value, v = conv.value;
  if(!b || !t){ $("#result").innerHTML = '<p class="empty">광고비와 객단가를 넣으면 바로 계산돼요</p>'; postHeight(); return; }
  if(r >= 100){ $("#result").innerHTML = '<p class="empty">원가율은 100% 미만으로 넣어주세요</p>'; postHeight(); return; }

  const unit = t / (1 + CONFIG.vatRate) * (1 - r / 100);
  const needCust = Math.ceil(b / unit);
  const clicks = c ? Math.floor(b / c) : null;
  const visitors = clicks != null && v ? clicks * v / 100 : null;
  const needClicks = v ? Math.ceil(needCust / (v / 100)) : null;
  const net = visitors != null ? visitors * unit - b : null;

  $("#result").innerHTML = `
    <p class="lead">광고비를 되찾으려면 광고를 보고 온 손님이</p>
    <p class="big">${won(needCust)}<small>명 와야 해요</small></p>
    <div class="rows">
      <div class="row"><span>손님 1명 남는 돈</span><b>${won(unit)}원</b></div>
      ${needClicks != null ? `<div class="row"><span>본전에 필요한 클릭</span><b>${won(needClicks)}번</b></div>` : ""}
      ${clicks != null ? `<div class="row"><span>광고비로 받는 클릭</span><b>${won(clicks)}번</b></div>` : ""}
      ${visitors != null ? `<div class="row"><span>예상 방문 손님</span><b>${num(visitors, 1)}명</b></div>
      <div class="row total"><span>광고로 남는 돈</span><b class="${net >= 0 ? "" : "neg"}">${net >= 0 ? "+" : ""}${won(net)}원</b></div>` : ""}
    </div>
    <p class="tip ${net != null && net < 0 ? "warn" : ""}">${visitors == null ? "광고 화면의 클릭 단가와 방문 전환율을 넣으면 예상 손님 수와 이익까지 알려드려요. 전환율은 \"광고 보고 왔다\"는 손님 수 ÷ 클릭 수로 구할 수 있어요."
      : net >= 0 ? `예상대로라면 광고비를 내고도 <b>${won(net)}원</b>이 남아요.` : `예상 손님이 본전(${won(needCust)}명)보다 적어요. 클릭 단가를 낮추거나 가게 소개·사진을 손봐서 전환율을 높여보세요.`}</p>
    ${ACTIONS}`;
  bindActions(`[지역광고 계산] 광고비 ${won(b)}원, 객단가 ${won(t)}원 → 손님 ${won(needCust)}명이면 본전${visitors != null ? `, 클릭 ${won(clicks)}번 × 전환율 ${num(v, 1)}% = 예상 ${num(visitors, 1)}명, ${won(net)}원` : ""}`,
    () => { budget.set(0); ticket.set(0); cpc.set(""); conv.set(""); rate.set(30); $("#budget").focus(); });
  postHeight();
}

$("#note").innerHTML = `<b>계산 기준</b> · 손님 1명 남는 돈 = 객단가 ÷ ${1 + CONFIG.vatRate} (부가세 ${CONFIG.vatRate * 100}% 뺀 금액) × (1 − 원가율), ${CONFIG.baseYear}년 기준<br>
  클릭 수 = 광고비 ÷ 클릭 단가, 방문 손님 = 클릭 수 × 전환율. 손님이 다시 오면 실제 효과는 더 커요.`;

Eltin.init();
render();
</script>
</body>
</html>
