<!DOCTYPE html>
<html lang="ko" data-cat="S" data-no="04">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S04 세트·1+1 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>세트·1+1 계산기</h1>
      <p>세트 메뉴나 1+1 행사를 했을 때 남는 금액을 계산해요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="seg" role="group" aria-label="행사 종류" id="modeSeg">
      <button type="button" data-mode="set" aria-pressed="true">세트 메뉴</button>
      <button type="button" data-mode="plus" aria-pressed="false">1+1 · 2+1 행사</button>
    </div>

    <div id="setBox">
      <div class="field">
        <label>세트에 들어가는 메뉴 <small>단품 가격은 부가세 포함</small></label>
        <div id="items"></div>
      </div>
      <div class="field">
        <label for="setPrice">세트 판매가</label>
        <div class="input-wrap"><input id="setPrice" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="setPriceHint"></div>
      </div>
    </div>

    <div id="plusBox" hidden>
      <div class="field-row">
        <div class="field">
          <label for="price">1개 판매가 <small>부가세 포함</small></label>
          <div class="input-wrap sm"><input id="price" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
          <div class="hint" id="priceHint"></div>
        </div>
        <div class="field">
          <label for="cost">1개 원가</label>
          <div class="input-wrap sm"><input id="cost" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
          <div class="hint" id="costHint"></div>
        </div>
      </div>
      <div class="field">
        <label>행사 방식</label>
        <div class="chips" id="nChips">
          <button class="chip" type="button" data-n="1" aria-pressed="true">1+1</button>
          <button class="chip" type="button" data-n="2" aria-pressed="false">2+1</button>
          <button class="chip" type="button" data-n="3" aria-pressed="false">3+1</button>
        </div>
      </div>
    </div>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== S04 세트·1+1 계산기 ===== */
const CONFIG = { vatRate: 0.10, baseYear: 2026 };   // 매년 확인할 값
const { $, $$, won, num, moneyInput, pick, rowList, ACTIONS, bindActions, postHeight } = Eltin;

let mode = "set", n = 1;
const ex = p => p / (1 + CONFIG.vatRate);           // 부가세 뺀 금액
const DEFAULT_ROWS = [{ name: "아메리카노" }, { name: "케이크" }];

const items = rowList($("#items"), {
  fields: [
    { key: "name",  type: "text",  label: "메뉴 이름", ph: "메뉴 이름" },
    { key: "price", type: "money", label: "단품 가격", unit: "원", ph: "4,500" },
    { key: "cost",  type: "money", label: "1개 원가", unit: "원", ph: "1,200" }
  ],
  rows: DEFAULT_ROWS,
  addLabel: "메뉴 추가",
  onChange: render
});
const setPrice = moneyInput($("#setPrice"), $("#setPriceHint"), render);
const price = moneyInput($("#price"), $("#priceHint"), render);
const cost = moneyInput($("#cost"), $("#costHint"), render);

const empty = msg => { $("#result").innerHTML = `<p class="empty">${msg}</p>`; postHeight(); };

/* 세트: 남는 돈 = 세트가(부가세 뺌) − 원가 합계 */
function renderSet(){
  const rows = items.rows().filter(r => r.price);
  const sp = setPrice.value;
  if(rows.length < 1 || !sp) return empty("단품 가격과 세트 판매가를 넣으면 바로 계산돼요");
  const listSum = rows.reduce((s, r) => s + r.price, 0), costSum = rows.reduce((s, r) => s + r.cost, 0);
  const off = listSum - sp, offPct = off / listSum * 100;
  const setProfit = ex(sp) - costSum, soloProfit = ex(listSum) - costSum;
  const rate = costSum / ex(sp) * 100;

  $("#result").innerHTML = `
    <p class="lead">${setProfit > 0 ? "세트 1개 팔면 남는 돈은" : "이 세트는 팔수록 손해예요"}</p>
    <p class="big ${setProfit > 0 ? "" : "neg"}">${setProfit < 0 ? "− " : ""}${won(Math.abs(setProfit))}<small>원</small></p>
    <div class="rows">
      <div class="row"><span>단품으로 따로 사면</span><b>${won(listSum)}원</b></div>
      <div class="row"><span>세트 할인</span><b>${won(off)}원 (${num(offPct, 1)}%)</b></div>
      <div class="row"><span>원가 합계</span><b>${won(costSum)}원</b></div>
      <div class="row"><span>세트 원가율</span><b>${num(rate, 1)}%</b></div>
      <div class="row total"><span>세트 1개 남는 돈</span><b class="${setProfit > 0 ? "" : "neg"}">${won(setProfit)}원</b></div>
    </div>
    ${off > 0 && setProfit > 0 ? `<p class="tip">단품으로 팔 때(${won(soloProfit)}원)보다 1세트에 <b>${won(soloProfit - setProfit)}원</b> 덜 남아요. 세트로 손님이 한 메뉴를 더 고르게 될 때 이득이에요.</p>` : ""}
    ${ACTIONS}`;
  bindActions(`[세트 계산] 단품 합계 ${won(listSum)}원 → 세트 ${won(sp)}원(${num(offPct, 1)}% 할인), 원가 ${won(costSum)}원, 세트 1개 남는 돈 ${won(setProfit)}원`,
    () => { items.set(DEFAULT_ROWS); setPrice.set(0); });
  postHeight();
}

/* N+1: 손님은 N개 값을 내고 N+1개를 가져감 */
function renderPlus(){
  const p = price.value, c = cost.value;
  if(!p || !c) return empty("판매가와 원가를 넣으면 바로 계산돼요");
  const pay = p * n, give = n + 1;
  const profit = ex(pay) - c * give, normal = (ex(p) - c) * give;
  const discPct = 1 / give * 100;

  $("#result").innerHTML = `
    <p class="lead">${n}+1 행사 한 번(${give}개)에 남는 돈은</p>
    <p class="big ${profit > 0 ? "" : "neg"}">${profit < 0 ? "− " : ""}${won(Math.abs(profit))}<small>원</small></p>
    <div class="rows">
      <div class="row"><span>손님이 내는 돈 (${n}개 값)</span><b>${won(pay)}원</b></div>
      <div class="row"><span>나가는 원가 (${give}개)</span><b>${won(c * give)}원</b></div>
      <div class="row"><span>실제 할인율</span><b>${num(discPct, 1)}%</b></div>
      <div class="row"><span>1개당 남는 돈</span><b class="${profit > 0 ? "" : "neg"}">${won(profit / give)}원</b></div>
      <div class="row total"><span>행사 1번 남는 돈</span><b class="${profit > 0 ? "" : "neg"}">${won(profit)}원</b></div>
    </div>
    <p class="tip ${profit > 0 ? "" : "warn"}">${profit > 0 ? `행사 없이 ${give}개를 팔면 <b>${won(normal)}원</b>이 남아요. ${n}+1은 <b>${num(discPct, 1)}%</b> 할인과 같아서, 원래 안 샀을 손님이 사야 이득이에요.`
      : `원가가 판매가의 ${num(n / give * 100 / (1 + CONFIG.vatRate), 1)}%를 넘으면 ${n}+1은 손해예요.`}</p>
    ${ACTIONS}`;
  bindActions(`[${n}+1 계산] 판매가 ${won(p)}원, 원가 ${won(c)}원 → 행사 1번 ${won(profit)}원 남음 (1개당 ${won(profit / give)}원, 실제 할인율 ${num(discPct, 1)}%)`,
    () => { price.set(0); cost.set(0); $("#price").focus(); });
  postHeight();
}

function render(){ mode === "set" ? renderSet() : renderPlus(); }

pick($$("#modeSeg button"), b => {
  mode = b.dataset.mode;
  $("#setBox").hidden = mode !== "set"; $("#plusBox").hidden = mode === "set";
  render();
});
pick($$("#nChips .chip"), b => { n = Number(b.dataset.n); render(); });

$("#note").innerHTML = `<b>계산 기준</b> · 남는 돈 = 받은 돈 ÷ ${1 + CONFIG.vatRate} (부가세 ${CONFIG.vatRate * 100}% 뺀 금액) − 원가, ${CONFIG.baseYear}년 기준<br>
  N+1의 실제 할인율 = 1 ÷ (N+1). 인건비·월세 같은 운영비는 빠진 금액이에요.`;

Eltin.init();
render();
</script>
</body>
</html>
