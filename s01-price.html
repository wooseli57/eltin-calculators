<!DOCTYPE html>
<html lang="ko" data-cat="S" data-no="01">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S01 판매가 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>
/* 이 계산기만 쓰는 작은 표 */
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.compare div{background:#fff;border-radius:var(--radius-sm);padding:8px 6px;text-align:center;font-size:12px;color:var(--ink-2)}
.compare div b{display:block;font-size:14px;color:var(--ink);margin-top:2px}
.compare div.on{outline:1.5px solid var(--brand)}
.compare div.on b{color:var(--brand-dark)}
.pct-wrap{width:120px}
</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>판매가 계산기</h1>
      <p>원가와 원하는 원가율로 얼마에 팔아야 하는지 알려줘요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="field">
      <label for="cost">메뉴 1개 원가 <small>재료비 + 포장비</small></label>
      <div class="input-wrap"><input id="cost" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
      <div class="hint" id="costHint"></div>
    </div>

    <div class="field">
      <label for="rate">목표 원가율 <small>판매가 중 원가가 차지하는 비율</small></label>
      <div class="input-wrap pct-wrap"><input id="rate" type="text" inputmode="decimal" autocomplete="off" value="30"><span class="unit">%</span></div>
      <div class="chips" id="rateChips">
        <button class="chip" type="button" data-rate="25" aria-pressed="false">25%</button>
        <button class="chip" type="button" data-rate="30" aria-pressed="true">30%</button>
        <button class="chip" type="button" data-rate="35" aria-pressed="false">35%</button>
        <button class="chip" type="button" data-rate="40" aria-pressed="false">40%</button>
      </div>
    </div>

    <div class="field">
      <label>가격 끝자리</label>
      <div class="seg" role="group" aria-label="가격 끝자리" style="margin-bottom:0">
        <button type="button" data-unit="100" aria-pressed="true">100원 단위</button>
        <button type="button" data-unit="500" aria-pressed="false">500원 단위</button>
        <button type="button" data-unit="1" aria-pressed="false">그대로</button>
      </div>
    </div>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== S01 판매가 계산기 ===== */
const CONFIG = { rates: { 2026: { vatRate: 0.10 } }, compareRates: [25, 30, 35] };   // 부가가치세율 10% (부가가치세법 제30조), 연도별로 나눠 둠
const R = Eltin.yearRates(CONFIG.rates), VAT = R.values.vatRate;
const { $, $$, won, num, toNum, copy, moneyInput, pick, postHeight } = Eltin;

let unit = 100;
const cost = moneyInput($("#cost"), $("#costHint"), render);
const rateInput = $("#rate");

/* 판매가(부가세 포함) = 원가 ÷ 원가율 × (1 + 부가세율), 끝자리는 올림
   - 1e-9: 소수 계산 오차(7700.000…01)로 한 단위 더 올라가는 것을 막음 */
function priceFor(c, ratePct){
  const supply = c / (ratePct / 100);
  const raw = supply * (1 + VAT);
  return Math.ceil(raw / unit - 1e-9) * unit;
}

function render(){
  const c = cost.value, r = toNum(rateInput.value);
  $$("#rateChips .chip").forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.rate) === r));
  if(!c || !r || r >= 100){
    $("#result").innerHTML = `<p class="empty">${r >= 100 ? "원가율은 100% 미만으로 넣어주세요" : "원가를 넣으면 바로 계산돼요"}</p>`;
    postHeight(); return;
  }
  const price  = priceFor(c, r);
  const supply = Math.ceil(price / (1 + VAT) - 1e-9);
  const vat    = price - supply;
  const profit = supply - c;
  const realRate = c / supply * 100;

  $("#result").innerHTML = `
    <p class="lead">원가율 ${r}%로 팔려면 판매가는</p>
    <p class="big">${won(price)}<small>원</small></p>
    <div id="chart"></div>
    <div class="rows">
      <div class="row"><span>메뉴 1개 원가</span><b>${won(c)}원</b></div>
      <div class="row"><span>부가세 뺀 판매가</span><b>${won(supply)}원</b></div>
      <div class="row"><span>부가세 (${VAT*100}%)</span><b>${won(vat)}원</b></div>
      <div class="row total"><span>1개 팔면 원가 빼고 남는 돈</span><b>${won(profit)}원</b></div>
    </div>
    <p class="tip">끝자리를 맞춘 뒤 실제 원가율은 <b>${realRate.toFixed(1)}%</b>예요. 인건비·월세 같은 운영비는 아직 빠진 금액이에요.</p>
    <div class="compare">${CONFIG.compareRates.map(x =>
      `<div class="${x === r ? "on" : ""}">원가율 ${x}%<b>${won(priceFor(c, x))}원</b></div>`).join("")}</div>
    <div class="actions">
      <button class="btn btn-primary" type="button" id="copy">결과 복사</button>
      <button class="btn btn-ghost" type="button" id="reset">처음으로</button>
    </div>`;
  Eltin.donut($("#chart"), [{ label: "원가", value: c }, { label: "부가세", value: vat }, { label: "남는 돈", value: profit }],
    { big: `${num(profit / price * 100, 1)}%`, small: "판매가 중 남는 돈" }, { loss: profit < 0 ? `비용이 판매가보다 ${won(-profit)}원 많아요` : "" });
  $("#copy").onclick = () => copy(`[판매가 계산] 원가 ${won(c)}원, 원가율 ${r}% → 판매가 ${won(price)}원 (부가세 포함, 1개당 남는 돈 ${won(profit)}원)`);
  postHeight();
}

rateInput.addEventListener("input", () => { rateInput.value = rateInput.value.replace(/[^\d.]/g, ""); render(); });
$$("#rateChips .chip").forEach(b => b.addEventListener("click", () => { rateInput.value = b.dataset.rate; render(); }));
pick($$(".seg button"), b => { unit = Number(b.dataset.unit); render(); });

$("#note").innerHTML = `<b>계산 기준</b> · 원가율은 부가세를 뺀 판매가 기준, 부가세율 ${VAT*100}% (${R.useYear}년 기준)<br>
  판매가는 부가세 포함 가격이며, 끝자리는 올림으로 맞춰요.`;

Eltin.yearNotice(R, "tax");

Eltin.init();
render();
</script>
</body>
</html>
