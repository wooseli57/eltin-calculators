<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엘틴 소상공인 무료 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>
/* 분류 버튼: 맨 앞 "전체", 그다음 대분류별 줄 (사장님 / 마진 / 홈베이킹 계산기). 대분류 이름표를 누르면 그 대분류만. 글자는 분류 이름 그대로, 좁으면 두 줄로 */
.jump{display:flex;flex-direction:column;gap:8px;padding:2px 2px 4px}
.jump-row{display:grid;gap:6px}
.jump .jump-label{all:unset;box-sizing:border-box;font-size:11px;font-weight:700;color:var(--ink-3);margin:2px 0 -3px 4px;cursor:pointer;align-self:flex-start;border-radius:6px;padding:1px 4px}
.jump .jump-label:hover,.jump .jump-label:focus-visible{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.jump .jump-label.on{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.jump button{min-width:0;text-align:center;border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700;letter-spacing:-.3px;line-height:1.25;color:var(--brand-dark);background:var(--brand-soft);
  border-radius:16px;padding:7px 4px;word-break:keep-all}
.jump button.on{color:#fff;background:var(--brand-dark)}
.jump button.all{--brand:#5F6B7A;--brand-dark:#4A5562;--brand-soft:#E6E9ED;align-self:flex-start;padding:7px 22px}
.sub-head{font-size:13px;font-weight:700;color:var(--ink-2);margin:14px 2px 8px}
.sub-head:first-of-type{margin-top:2px}
.calc-item .step{flex:none;font-size:11px;font-weight:700;color:var(--brand-dark);border:1px solid var(--brand);border-radius:999px;padding:1px 7px}
.also{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.also .sub-head{margin-top:0}
.calc-item .member{flex:none;font-size:11px;font-weight:700;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.calc-item.soon .member{opacity:.7}
.member-note{font-size:12px;color:var(--ink-2);background:var(--card);border-radius:var(--radius-sm);padding:8px 12px;text-align:center}
.cat{scroll-margin-top:12px}
.cat[hidden]{display:none}
.cat-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.cat-head h2{font-size:17px;font-weight:800;color:var(--brand-dark)}
.cat-head h2::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:7px;vertical-align:2px}
.cat-head small{font-size:12px;color:var(--ink-3)}
.cat-head .count{margin-left:auto;font-size:12px;color:var(--ink-3)}
.list{display:flex;flex-direction:column;gap:8px}
.calc-item{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;
  background:#fff;transition:.15s;position:relative}
a.calc-item:hover{border-color:var(--brand);background:var(--brand-faint)}
a.calc-item::after{content:"›";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--brand)}
.calc-item .t{display:flex;align-items:center;gap:8px;padding-right:18px}
.calc-item .code{flex:none;font-size:11px;font-weight:800;color:var(--brand-dark);background:var(--brand-soft);border-radius:6px;padding:2px 6px}
.calc-item b{font-size:15px;font-weight:700}
.calc-item p{font-size:13px;color:var(--ink-2);margin-top:4px;padding-right:18px;line-height:1.5}
.calc-item.soon{background:var(--bg);border-style:dashed}
.calc-item.soon b,.calc-item.soon p{color:var(--ink-3)}
.calc-item.soon .code{background:var(--line);color:var(--ink-3)}
.calc-item .badge{margin-left:auto;flex:none;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:#fff}
</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <h1>엘틴 소상공인 무료 계산기</h1>
      <p>카페·베이커리 사장님과 홈베이킹을 위한 무료 계산기 66개예요. 필요한 계산기를 골라 보세요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <nav class="jump" id="jump" aria-label="분류 바로가기"></nav>
  <p class="member-note">🔒 표시는 엘틴 쇼핑몰 회원 전용이에요. 회원가입은 무료예요.</p>
  <div id="cats" style="display:flex;flex-direction:column;gap:12px"><section class="card"><p class="empty">계산기 목록을 불러오는 중이에요</p></section></div>

  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== 계산기 목록 페이지 =====
   data/calculators.json(원본 docs/calculators.md)으로 분류별 목록을 그림.
   상태가 "완료"인 계산기만 링크, 나머지는 회색 "준비 중". 회원 모드면 계산기로 넘어갈 때도 member=1 유지 */
const { $, postHeight, keepMember } = Eltin;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* 분류 버튼 줄 = 대분류(JSON groups, 원본 docs/calculators.md의 `# 1. 이름`). 2026-11-28 개편: docs/restructure-2026-11-28.md
   한 줄에 4개까지, 5개면 3+2 두 줄 */
const MAX_ROW = 4;
/* 옛 번호 → 새 번호 (2026-11-28 개편). 아임웹 주소 #A01·#S08·#G06·#A 와 ?open= 이 계속 열리게 */
const OLD = { A01: "E04", A02: "E06", A03: "E05", A04: "P04", A05: "P05", A06: "P06",
  S08: "P01", S09: "P02", S10: "P03", G04: "K01", G05: "K02", G06: "K03", G07: "K04", A: "P" };
const newCode = v => { const k = String(v || "").replace("#", "").toUpperCase(); return OLD[k] || k; };
/* 회원 전용(🔒)은 GitHub 주소가 아니라 아임웹 회원 전용 페이지로 (docs/specs/access.md) */
const item = (c, step) => {
  const member = c.access === "member";
  const head = `<span class="t"><span class="code">${c.tag}</span><b>${esc(c.name)}</b>${step && c.step ? `<span class="step">${esc(c.step)}</span>` : ""}${member ? `<span class="member" title="엘틴 쇼핑몰 회원 전용 (회원가입 무료)">🔒 회원</span>` : ""}`;
  const ln = Eltin.calcLink(c);                                        // 회원 모드가 아니면 회원 전용은 아임웹 회원 페이지(_top)
  return c.status === "완료"
    ? `<a class="calc-item" data-cat="${c.cat}" href="${esc(ln.href)}" target="${ln.target}">${head}</span><p>${esc(c.desc)}</p></a>`
    : `<div class="calc-item soon" aria-disabled="true">${head}<span class="badge">준비 중</span></span><p>${esc(c.desc)}</p></div>`;
};
const stepNo = s => { const m = /(\d+)\s*\/\s*\d+/.exec(s || ""); return m ? Number(m[1]) : 0; };

let GROUPS = [];
function draw(d){
  const done = d.calculators.filter(c => c.status === "완료").length;
  const byCat = Object.fromEntries(d.categories.map(g => [g.cat, g]));
  /* 분류 버튼 = 필터 (아임웹 iframe 안에서는 #앵커로 스크롤이 안 되므로 해당 분류만 보여주는 방식) */
  const cnt = k => d.calculators.filter(c => c.cat === k).length;     // 분류별 계산기 수 (준비 중 포함, 함께 보이기는 세지 않음)
  const groups = (d.groups && d.groups.length ? d.groups : [{ no: "", name: "", cats: d.categories.map(g => g.cat) }])
    .map(g => ({ ...g, cats: g.cats.filter(k => byCat[k]) }));
  /* 대분류 이름표: 이름 · 누구나|회원 · (모두 연결 계산이면) 연결 계산 */
  const gLabel = g => {
    const list = d.calculators.filter(c => g.cats.includes(c.cat));
    const acc = list.every(c => c.access === "free") ? "누구나" : list.every(c => c.access === "member") ? "회원" : "";
    const linked = g.cats.every(k => byCat[k].group === "연결");
    return [g.name, acc, linked ? "연결 계산" : ""].filter(Boolean).join(" · ");
  };
  const rowsOf = cats => { if(cats.length <= MAX_ROW) return [cats]; const h = Math.ceil(cats.length / 2); return [cats.slice(0, h), cats.slice(h)]; };
  GROUPS = groups;
  $("#jump").innerHTML = `<button type="button" class="all on" data-f="">전체 (${d.calculators.length})</button>`
    + groups.map(g => `${g.name ? `<button type="button" class="jump-label" data-g="${g.no}">${esc(gLabel(g))}</button>` : ""}${
      rowsOf(g.cats).map(cats => `<div class="jump-row" style="grid-template-columns:repeat(${cats.length},minmax(0,1fr))">${
        cats.map(k => `<button type="button" data-cat="${k}" data-f="${k}">${esc(byCat[k].name)} (${cnt(k)})</button>`).join("")}</div>`).join("")}`).join("");

  $("#cats").innerHTML = d.categories.map(g => {
    const linked = g.group === "연결";
    let list = d.calculators.filter(c => c.cat === g.cat);
    if(linked) list = [...list].sort((a, b) => stepNo(a.step) - stepNo(b.step) || a.no.localeCompare(b.no));
    const ok = list.filter(c => c.status === "완료").length;
    /* 세부 분류(### 가격 정하기 등)는 분류 안 작은 제목 */
    const subs = [...new Set(list.map(c => c.sub))];
    const body = subs.map(sub => `${sub ? `<h3 class="sub-head">${esc(sub)}</h3>` : ""}<div class="list">${list.filter(c => c.sub === sub).map(c => item(c, linked)).join("")}</div>`).join("");
    /* 함께 보이기: 다른 분류 계산기 중 이 분류 글자를 적은 것 + 이 분류 계산기가 적은 태그 */
    const tags = new Set();
    d.calculators.forEach(c => { if(c.cat !== g.cat && (c.also || []).includes(g.cat)) tags.add(c.tag); });
    list.forEach(c => (c.also || []).forEach(a => { if(/^[A-Z]\d\d$/.test(a)) tags.add(a); }));
    const also = d.calculators.filter(c => tags.has(c.tag));
    return `<section class="card cat" id="cat-${g.cat}" data-cat="${g.cat}">
      <div class="cat-head"><h2>${esc(g.name)}</h2>${g.note ? `<small>${esc(g.note)}</small>` : ""}<span class="count">${ok}/${list.length}</span></div>
      ${body}
      ${also.length ? `<div class="also"><h3 class="sub-head">함께 쓰면 좋은 계산기</h3><div class="list">${also.map(c => item(c, false)).join("")}</div></div>` : ""}
    </section>`;
  }).join("");
  $(".calc-head p").innerHTML = `카페·베이커리 사장님과 홈베이킹을 위한 무료 계산기 ${done}개예요.<br>필요한 계산기를 골라 보세요`;
  $("#jump").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    const g = b.dataset.g, f = b.dataset.f || "";
    const show = g ? (GROUPS.find(x => String(x.no) === g) || { cats: [] }).cats : f ? [f] : null;   // null = 전체
    document.querySelectorAll("#jump button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll("#cats .cat").forEach(s => { s.hidden = !!show && !show.includes(s.dataset.cat); });
    const key = g || f;
    try { history.replaceState(null, "", location.pathname + location.search + (key ? "#" + key : "")); } catch(_){}
    postHeight();
  });
  /* 주소 끝 #M 처럼 분류를 붙이면 그 분류만, #1·#2·#3이면 그 대분류만 보여줌 (블로그·아임웹 메뉴 연결용)
     주소의 ?open=S (아임웹 페이지 주소 #S를 아임웹 코드가 넘김) 또는 #S. 옛 글자는 새 글자로 (#A → P) */
  const start = newCode(new URLSearchParams(location.search).get("open") || location.hash || "");
  const sb = start && (document.querySelector(`#jump button[data-f="${start}"]`) || document.querySelector(`#jump button[data-g="${start}"]`));
  if(sb) sb.click();
  postHeight();
}

Eltin.init();
/* 회원 모드(회원 전용 아임웹 페이지 안)에서는 안내 문구를 바꿈 */
if(Eltin.memberMode()) $(".member-note").textContent = "🔒 표시는 엘틴 쇼핑몰 회원 전용이에요. 회원 전용 계산기를 모두 쓸 수 있어요.";

/* ?open=M05 (계산기 태그): 완료된 계산기면 그 계산기로 바로 이동 (embed·member 유지).
   회원 전용인데 회원 모드가 아니면 같은 iframe에서 그 계산기를 열어 안내 카드를 보여줌 (iframe에서 바깥 페이지로는 보낼 수 없음) */
function openCalc(d){
  const tag = newCode(new URLSearchParams(location.search).get("open") || location.hash || "");   // 옛 번호(A01 등)는 새 번호로
  if(!/^[A-Z]\d\d$/.test(tag)) return false;
  const c = d.calculators.find(x => x.tag === tag && x.status === "완료");
  if(!c) return false;
  location.replace(keepMember(c.file));
  return true;
}

Eltin.loadCalcs().then(d => {
  if(d && openCalc(d)) return;
  if(d) draw(d);
  else { $("#cats").innerHTML = '<section class="card"><p class="empty">계산기 목록을 불러오지 못했어요. 잠시 뒤 다시 열어주세요.</p></section>'; postHeight(); }
});
</script>
</body>
</html>
