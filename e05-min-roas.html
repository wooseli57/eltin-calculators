<!DOCTYPE html>
<html lang="ko" data-cat="E" data-no="05" data-access="member">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E05 최저 목표 광고수익률 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.compare div{background:#fff;border-radius:var(--radius-sm);padding:8px 6px;text-align:center;font-size:12px;color:var(--ink-2)}
.compare div b{display:block;font-size:14px;color:var(--ink);margin-top:2px}
.compare div.on{outline:1.5px solid var(--brand)}
.compare div.on b{color:var(--brand-dark)}
</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>최저 목표 광고수익률 계산기</h1>
      <p>광고를 설정할 때 목표 광고수익률을 최소 몇 % 이상으로 잡아야 손해가 안 나는지 알려줘요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="seg" role="group" aria-label="계산 방식" id="modeSeg">
      <button type="button" data-mode="simple" aria-pressed="true">간단 계산</button>
      <button type="button" data-mode="margin" aria-pressed="false">마진 정보로 계산</button>
    </div>
    <div id="simpleBox">
      <div class="field">
        <label for="price">판매가 <small>로켓배송은 쿠팡 판매가</small></label>
        <div class="input-wrap"><input id="price" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="priceHint"></div>
      </div>
      <div class="field">
        <label for="maxAd">최대광고비 <small>1개 팔 때</small></label>
        <div class="input-wrap"><input id="maxAd" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="maxAdHint"></div>
        <p class="help">모르면 '마진 정보로 계산'을 쓰세요</p>
      </div>
    </div>
    <div id="marginBox" hidden></div>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script src="assets/margin-engine.js"></script>
<script src="assets/margin-ui.js"></script>
<script>
/* ===== E05 (옛 A03) 최저 목표 광고수익률 계산기 — 사양: docs/specs/A03.md =====
   최저 목표 광고수익률 = 판매가 ÷ 최대광고비 × 100 (판매가 기준). 마진 정보 방식은 공통 엔진의 minRoas·minRoasTax */
const CONFIG = { compareSteps: [0.8, 1, 1.2] };   // 간단 계산 비교: 최대광고비 −20% / 그대로 / +20%
const { $, $$, won, num, moneyInput, pick, ACTIONS, bindActions, postHeight } = Eltin;
const pct = v => `${num(v, 1)}%`;

let mode = "simple";
const price = moneyInput($("#price"), $("#priceHint"), render);
const maxAd = moneyInput($("#maxAd"), $("#maxAdHint"), render);
const form = MarginUI.form($("#marginBox"), { mode: "both", onChange: render });
/* 연결 단계 (docs/restructure-2026-11-28.md 4절): 앞 단계 입력값이 넘어오면 "마진 정보" 방식으로 칸을 채움.
   다음 단계(E06)에는 마진 정보 방식이면 지금 입력 기준으로 다시 계산한 값, 간단 계산이면 받은 값을 그대로 넘김 */
const got = MarginUI.received(), passed = MarginUI.passThrough();

function render(){
  let P, A, A2 = null, rocket = false;
  Eltin.setFlow({ query: mode === "simple" ? passed : "" });
  if(mode === "simple"){
    P = price.value; A = maxAd.value;
    if(!P || !A){ $("#result").innerHTML = '<p class="empty">판매가와 최대광고비를 넣으면 바로 계산돼요</p>'; postHeight(); return; }
  } else {
    const x = form.values(); rocket = x.type === "rocket";
    if(!x.price || !x.buy){ $("#result").innerHTML = '<p class="empty">판매가와 매입가를 넣으면 바로 계산돼요</p>'; postHeight(); return; }
    const m = MarginEngine.calcMargin(x);
    P = x.price; A = m.maxAd; A2 = m.minRoasTax;
    Eltin.setFlow({ query: MarginUI.flowQuery(form, m) });
  }
  if(A <= 0){
    $("#result").innerHTML = `<p class="lead">최저 목표 광고수익률은</p><p class="big">설정 불가</p>
      <p class="tip warn">지금 조건으로는 광고비를 쓸 여유가 없어요. 판매가·매입가를 먼저 점검하세요.</p>`;
    postHeight(); return;
  }
  const roas = P / A * 100;

  $("#result").innerHTML = `
    <p class="lead">목표 광고수익률은 최소 이만큼 이상으로 설정하세요</p>
    <p class="big">${num(roas, 1)}<small>%</small></p>
    <div class="rows">
      <div class="row"><span>판매가</span><b>${won(P)}원</b></div>
      <div class="row"><span>최대광고비</span><b>${won(A)}원</b></div>
      <div class="row"><span>최대광고비 비율 (판매가 기준)</span><b>${pct(A / P * 100)}</b></div>
      ${A2 ? `<div class="row"><span>세금 효과 반영 최저 광고수익률 (참고)</span><b>${pct(A2)}</b></div>` : ""}
      <div class="row total"><span>최저 목표 광고수익률</span><b>${pct(roas)}</b></div>
    </div>
    <p class="tip">이 값보다 낮게 설정하면 광고비가 많이 나가서 팔수록 손해예요. 여유를 두려면 이보다 높게 잡으세요.</p>
    ${mode === "simple" || rocket ? `<p class="tip">쿠팡 광고 화면의 광고수익률과 같은 판매가 기준이에요.</p>` : ""}
    ${mode === "simple" ? `<div class="compare">${CONFIG.compareSteps.map(k => `<div class="${k === 1 ? "on" : ""}">최대광고비 ${k === 1 ? "그대로" : `${k > 1 ? "+" : "−"}${Math.round(Math.abs(k - 1) * 100)}%`}<b>${pct(P / (A * k) * 100)}</b></div>`).join("")}</div>` : ""}
    ${ACTIONS}`;
  bindActions(`[최저 목표 광고수익률] 판매가 ${won(P)}원, 최대광고비 ${won(A)}원 → 최저 목표 광고수익률 ${pct(roas)}${A2 ? ` (세금 효과 반영 ${pct(A2)})` : ""}`,
    () => { price.set(0); maxAd.set(0); form.reset(); });
  postHeight();
}

pick($$("#modeSeg button"), b => {
  mode = b.dataset.mode;
  $("#simpleBox").hidden = mode !== "simple"; $("#marginBox").hidden = mode === "simple";
  render();
});

if(got){                                                   // 받은 값이 있으면 "마진 정보" 방식으로 열기
  const mb = [...$$("#modeSeg button")].find(b => b.dataset.mode !== "simple");
  form.set(got); if(mb) mb.click();
}

$("#note").innerHTML = `<b>계산 기준</b> · 광고수익률(ROAS) = 매출 ÷ 광고비 × 100, 판매가 기준이에요. 최저 목표 광고수익률 = 판매가 ÷ 최대광고비 × 100.<br>
  이 값으로 광고하면 광고비 = 판매가 ÷ (광고수익률 ÷ 100) = 최대광고비가 돼요.`;
MarginUI.notice(false);

Eltin.init();
render();
</script>
</body>
</html>
