<!DOCTYPE html>
<html lang="ko" data-cat="G" data-no="02" data-access="member">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G02 생크림 색 배합 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;margin-top:10px}
.check input{width:18px;height:18px;accent-color:var(--brand-dark);flex:none}
.links .btn{display:block;width:100%;margin-top:10px;padding:11px;text-align:center;text-decoration:none}
.btn.soon{background:var(--line);color:var(--ink-3);cursor:not-allowed}
</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>생크림 색 배합</h1>
      <p>원하는 색이나 인기 색을 고르면 흰 생크림에 넣을 엘틴 색소 조합과 양을 알려줘요. 바탕색 안내 포함</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="field">
      <label>원하는 색</label>
      <div id="target"></div>
    </div>
    <div class="field">
      <label>가진 색소 <small>기본 8색</small></label>
      <div id="dots"></div>
      <label class="check"><input type="checkbox" id="more"> 진한2·3·계절 색도 있어요 <small>(1색 배합에 포함)</small></label>
    </div>
    <div class="field">
      <label for="amount">내 생크림 양</label>
      <div class="input-wrap"><input id="amount" type="text" inputmode="decimal" autocomplete="off" value="300"><span class="unit">g</span></div>
    </div>
  </section>

  <section class="result" aria-live="polite" id="result"><p class="empty">측정 자료를 불러오는 중이에요</p></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script src="assets/eltin-color.js"></script>
<script>
/* ===== G02 생크림 색 배합 — 사양: docs/specs/G-color.md 4절 =====
   측정된 생크림 칩(단색 48색 1~10방울(3·5·7·9는 중간값), 기본 8색 2·3색) 중 원하는 색과 색차(CIEDE2000)가 작은 3개.
   가진 색소로만 된 배합만. 내 양 = 생크림 10g당 방울 × (내 g ÷ 10), 방울 정수 반올림, g = 방울 × 0.04 × 1.05 */
const BASE = "cream";
const { $, won, num, numInput, ACTIONS, bindActions, postHeight, esc, param } = Eltin;
const C = EltinColor;
const amount = numInput($("#amount"), render);
if(param("g") > 0) $("#amount").value = String(param("g"));
let target = null, owned = [];

C.load().then(D => {
  const dots = C.dots($("#dots"), { max: 8, value: D.basic.slice(), onChange: v => { owned = v; render(); } });
  owned = dots.value;
  $("#more").addEventListener("change", render);
  target = C.targetPicker($("#target"), () => render());
}).catch(() => { $("#result").innerHTML = '<p class="empty">측정 자료를 불러오지 못했어요. 잠시 뒤 다시 열어주세요.</p>'; postHeight(); });

function render(){
  if(!target || !C.data) return;
  const hex = target.value, g = amount.value;
  const colors = owned.concat($("#more").checked ? Object.keys(C.data.colors).filter(ab => !C.data.basic.includes(ab)) : []);
  if(!colors.length){ $("#result").innerHTML = '<p class="empty">가진 색소를 하나 이상 골라주세요</p>'; postHeight(); return; }
  const list = C.nearest(BASE, hex, { colors, limit: 3 });
  if(!list.length){ $("#result").innerHTML = '<p class="empty">가진 색소로 만든 측정 배합이 없어요. 색소를 더 골라주세요</p>'; postHeight(); return; }
  const r02 = Eltin.ready("R02");
  const name = target.presetName();
  $("#result").innerHTML = `
    <p class="lead">${name ? esc(name) + "에 " : ""}가장 가까운 엘틴 배합이에요</p>
    ${list.map((c, i) => {
      const mine = g > 0 ? C.scale(BASE, c.mix, g) : [];
      return `<div class="cg-result">
        <p class="cg-rank">${i + 1}위 · ${C.deltaWord(c.dE)} (색차 ${num(c.dE, 1)})</p>
        ${C.compare(hex, c.hex)}
        <div class="rows">
          <div class="row"><span>생크림 10g당 배합<small>${c.measured ? (c.no ? `엘틴 컬러칩 ${c.no} · ${esc(c.code)}` : `측정값 · ${esc(c.code || "")}`) : "측정 사이 중간값"}</small></span><b>${esc(C.mixText(c.mix))}</b></div>
          ${mine.map(m => `<div class="row"><span>${esc(m.name)}<small>내 생크림 ${num(g, 1)}g</small></span><b>${won(m.drops)}방울 <small>(${num(m.g, 2)}g)</small></b></div>`).join("")}
        </div>
      </div>`;
    }).join("")}
    <div class="links">${r02 ? `<a class="btn btn-primary" href="${Eltin.keepMember("r02-color-dosage.html?mix=" + Object.entries(list[0].mix).map(([ab, d]) => ab + ":" + d).join(",") + (g ? "&g=" + g : ""))}" target="_self">이 배합으로 양 계산 →</a>`
      : '<span class="btn soon" aria-disabled="true">이 배합으로 양 계산 · 준비 중</span>'}</div>
    ${ACTIONS}`;
  const top = list[0], mine = g > 0 ? C.scale(BASE, top.mix, g) : [];
  bindActions(`엘틴 조색 · 원하는 색 ${hex} · 생크림 ${num(g, 1)}g · ${mine.map(m => `${m.name} ${won(m.drops)}방울(${num(m.g, 2)}g)`).join(" + ")} · 예상 색 ${top.hex.toLowerCase()} (색차 ${num(top.dE, 1)})`);
  postHeight();
}
window.addEventListener("eltin:calcs", render);

$("#note").innerHTML = `<b>계산 기준</b> · ${C.METHOD.cream}`;

Eltin.init();
</script>
</body>
</html>
