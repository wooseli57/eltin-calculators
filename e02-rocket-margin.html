<!DOCTYPE html>
<html lang="ko" data-cat="E" data-no="02" data-access="member">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E02 로켓배송 마진계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>.big .sub{font-size:16px;font-weight:700;color:var(--ink-2);margin-left:6px}</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>로켓배송 마진계산기</h1>
      <p>쿠팡 로켓배송처럼 납품해서 파는 상품을, 판매가에서 수수료를 뺀 납품가 기준으로 순이익과 순이익률을 계산해요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력" id="form"></section>

  <section class="result" aria-live="polite" id="result"></section>
  <section id="targetBox"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script src="assets/margin-engine.js"></script>
<script src="assets/margin-ui.js"></script>
<script>
/* ===== E02 로켓배송 마진계산기 — 사양: docs/specs/E02.md =====
   공통 엔진 type 'rocket': 마켓수수료는 납품가에 이미 빠져 있으므로 비용에 넣지 않음 */
const { $, won, num, ACTIONS, bindActions, postHeight } = Eltin;
const pct = v => `${v < 0 ? "−" : ""}${num(Math.abs(v), 1)}%`;

const form = MarginUI.form($("#form"), { mode: "rocket", onChange: render });
const target = MarginUI.target($("#targetBox"), () => form.values(), { buyFirst: true });

function render(){
  const x = form.values();
  target.refresh();
  if(!x.price || !x.buy){ $("#result").innerHTML = '<p class="empty">쿠팡 판매가와 매입가를 넣으면 바로 계산돼요</p>'; postHeight(); return; }
  const m = MarginEngine.calcMargin(x), loss = m.net < 0;
  const roasExample = 1000 * (1 - x.fee / 100);

  $("#result").innerHTML = `
    <p class="lead">1개 납품하면 세금까지 빼고 남는 돈은</p>
    <p class="big">${loss ? "− " : ""}${won(Math.abs(m.net))}<small>원${loss ? " 손실" : ""}</small><span class="sub">${pct(m.netRate)}</span></p>
    <div id="chart"></div>
    <p class="chart-note">쿠팡 판매가 ${won(x.price)}원 중 ${pct(x.fee)}(${won(m.feeAmt)}원)는 쿠팡 몫이에요.</p>
    <div class="rows">
      <div class="row"><span>쿠팡 판매가</span><b>${won(x.price)}원</b></div>
      <div class="row"><span>납품가 (수수료 ${num(x.fee, 2)}% 뺌)</span><b>${won(m.base)}원</b></div>
      <div class="row"><span>가격마진 (납품가 − 매입가)</span><b>${won(m.priceMargin)}원 · ${pct(m.priceMarginRate)}</b></div>
      <div class="row"><span>포장비</span><b>− ${won(x.pack)}원</b></div>
      <div class="row"><span>광고비 (납품가의 ${num(x.ad, 2)}%)</span><b>− ${won(m.adAmt)}원</b></div>
      <div class="row"><span>기타비용 (납품가의 ${num(x.etc, 2)}%)</span><b>− ${won(m.etcAmt)}원</b></div>
      <div class="row"><span>부가세</span><b>− ${won(m.vat)}원</b></div>
      <div class="row"><span>소득세 (${pct(x.tax)})</span><b>− ${won(m.tax)}원</b></div>
      <div class="row total"><span>세후 순이익 (납품가 기준 ${pct(m.netRate)})</span><b>${loss ? "− " : ""}${won(Math.abs(m.net))}원</b></div>
    </div>
    ${loss ? `<p class="tip warn">매입가를 낮추거나 공급률을 다시 협상해야 해요. 아래 목표 설계에서 목표 최고 매입가를 확인해 보세요.</p>` : ""}
    <p class="tip">최대광고비 <b>${won(m.maxAd)}원</b> · 판매가의 <b>${pct(m.maxAdRateSale)}</b> (납품가 기준 ${pct(m.maxAdRateBase)}) · 최저 목표 광고수익률 <b>${m.minRoas ? pct(m.minRoas) : "설정 불가"}</b></p>
    <p class="tip">쿠팡 광고 화면의 광고수익률은 판매가 기준이에요. 수수료 ${pct(x.fee)}라면 쿠팡에서 1,000%가 나와도 우리 매출 기준으로는 ${num(roasExample, 0)}% 수준이에요.</p>
    ${ACTIONS}`;
  Eltin.donut($("#chart"), [
    { label: "매입가", value: x.buy }, { label: "포장비", value: x.pack }, { label: "광고비", value: m.adAmt },
    { label: "기타비용", value: m.etcAmt }, { label: "부가세", value: m.vat }, { label: "소득세", value: m.tax },
    { label: "세후 순이익", value: m.net }
  ], { big: pct(m.netRate), small: "세후 순이익률" }, { loss: loss ? `비용이 납품가보다 ${won(-m.net)}원 많아요` : "" });
  /* 다음 단계(E04 최대광고비 → … → E03 상품 손익)로 넘기는 값 — docs/restructure-2026-11-28.md 4절 (E03 값은 M05-M06-E03.md, 세전 이익 ebt).
     광고를 안 하면 "상품 손익으로 바로 가기"(E03) */
  Eltin.setFlow({ query: MarginUI.flowQuery(form, m), shortcut: "E03" });
  bindActions(`[로켓배송 마진] 쿠팡 판매가 ${won(x.price)}원, 수수료 ${pct(x.fee)} → 납품가 ${won(m.base)}원, 매입가 ${won(x.buy)}원 → 세후 순이익 ${won(m.net)}원 (납품가 기준 ${pct(m.netRate)}), 최대광고비 ${won(m.maxAd)}원(판매가의 ${pct(m.maxAdRateSale)})`,
    () => form.reset());
  postHeight();
}

$("#note").innerHTML = `<b>계산 기준</b> · 납품가 = 쿠팡 판매가 × (1 − 수수료율). 셀러 관점(납품가 기준): 가격마진·광고비·기타비용·부가세·소득세·순이익률. 마켓수수료는 납품가에 이미 빠져 있어서 비용에 다시 넣지 않아요.<br>
  마켓 관점(판매가 기준): 최대광고비 비율 대표값, 최저 목표 광고수익률 = 판매가 ÷ 최대광고비 × 100.`;
MarginUI.notice(true);

Eltin.init();
render();
</script>
</body>
</html>
