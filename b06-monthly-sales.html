<!DOCTYPE html>
<html lang="ko" data-cat="B" data-no="06" data-access="member">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B06 월 매출 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>월 매출 계산기</h1>
      <p>객단가·손님 수·영업일(온라인은 판매량·판매가)로 예상 매출을 구하거나, 목표 이익에 필요한 매출을 거꾸로 알려줘요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="field">
      <label for="goal">한 달에 벌고 싶은 돈 <small>사장님 몫, 세금 내기 전</small></label>
      <div class="input-wrap"><input id="goal" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
      <div class="hint" id="goalHint"></div>
      <div class="chips">
        <button class="chip" type="button" data-goal="3000000">300만</button>
        <button class="chip" type="button" data-goal="5000000">500만</button>
        <button class="chip" type="button" data-goal="7000000">700만</button>
        <button class="chip" type="button" data-goal="10000000">1,000만</button>
      </div>
    </div>
    <div class="field">
      <label for="fixed">월 고정비 <small>직접 입력 · 인건비·월세 등</small></label>
      <div class="input-wrap"><input id="fixed" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
      <div class="hint" id="fixedHint"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="price">평균 판매가 <small>부가세 포함</small></label>
        <div class="input-wrap sm"><input id="price" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="priceHint"></div>
      </div>
      <div class="field">
        <label for="cost">1개 원가 <small>M04 메뉴 원가</small></label>
        <div class="input-wrap sm"><input id="cost" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="costHint"></div>
      </div>
    </div>
    <div class="field">
      <label for="days">한 달 영업일</label>
      <div class="input-wrap"><input id="days" type="text" inputmode="numeric" autocomplete="off" value="26"><span class="unit">일</span></div>
    </div>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== B06 목표매출 계산기 ===== */
const CONFIG = { rates: { 2026: { vatRate: 0.10 } } };   // 부가가치세율 10% (부가가치세법 제30조), 연도별로 나눠 둠
const R = Eltin.yearRates(CONFIG.rates), VAT = R.values.vatRate;
const { $, $$, won, num, koreanUnit, moneyInput, numInput, ACTIONS, bindActions, postHeight } = Eltin;

const goal = moneyInput($("#goal"), $("#goalHint"), render);
const fixed = moneyInput($("#fixed"), $("#fixedHint"), render);
const price = moneyInput($("#price"), $("#priceHint"), render);
const cost = moneyInput($("#cost"), $("#costHint"), render);
const days = numInput($("#days"), render);

/* 1개 남는 돈 = 판매가 ÷ (1 + 부가세율) − 원가
   필요 판매 개수 = (목표 이익 + 월 고정비) ÷ 1개 남는 돈 (올림) */
function render(){
  const g = goal.value, f = fixed.value, p = price.value, c = cost.value, d = days.value;
  if(!p || (!g && !f)){ $("#result").innerHTML = '<p class="empty">목표 금액·고정비·판매가를 넣으면 바로 계산돼요</p>'; postHeight(); return; }
  const unit = p / (1 + VAT) - c;
  if(unit <= 0){ $("#result").innerHTML = '<p class="empty">판매가가 원가보다 낮아서 팔수록 손해예요</p>'; postHeight(); return; }
  if(!d){ $("#result").innerHTML = '<p class="empty">영업일을 넣어주세요</p>'; postHeight(); return; }

  const monthQty = Math.ceil((g + f) / unit - 1e-9);   // - 1e-9: 소수 계산 오차(100.00000000000001)로 한 개 더 올라가는 것을 막음
  const dayQty = Math.ceil(monthQty / d);
  const monthSales = monthQty * p, daySales = dayQty * p;

  $("#result").innerHTML = `
    <p class="lead">목표를 이루려면 하루 매출은</p>
    <p class="big">${won(daySales)}<small>원</small></p>
    <div id="chart"></div>
    <div class="rows">
      <div class="row"><span>하루 판매 개수</span><b>${won(dayQty)}개</b></div>
      <div class="row"><span>한 달 판매 개수</span><b>${won(monthQty)}개</b></div>
      <div class="row total"><span>한 달 매출 (부가세 포함)</span><b>${won(monthSales)}원</b></div>
      <div class="row"><span>1개 팔면 남는 돈</span><b>${won(unit)}원</b></div>
    </div>
    <p class="tip">하루 ${won(dayQty)}개, 한 달 ${koreanUnit(monthSales)} 매출이면 고정비 ${koreanUnit(f) || "0원"}을 내고 ${koreanUnit(g) || "0원"}이 남아요. 영업시간이 10시간이면 시간당 <b>${num(dayQty / 10, 1)}개</b>예요.</p>
    ${ACTIONS}`;
  const mVat = monthSales - monthSales / (1 + VAT), mProfit = monthQty * unit - f; Eltin.donut($("#chart"), [{ label: "고정비", value: f }, { label: "원가", value: monthQty * c }, { label: "부가세", value: mVat }, { label: "목표 이익", value: mProfit }], { big: `${num(mProfit / monthSales * 100, 1)}%`, small: "매출 중 남는 돈" });
  bindActions(`[목표매출 계산] 목표 ${won(g)}원 + 고정비 ${won(f)}원, 판매가 ${won(p)}원·원가 ${won(c)}원 → 하루 ${won(dayQty)}개·${won(daySales)}원, 월 매출 ${won(monthSales)}원 (${num(d, 0)}일 영업)`,
    () => { goal.set(0); fixed.set(0); price.set(0); cost.set(0); days.set(26); $("#goal").focus(); });
  postHeight();
}

$$("[data-goal]").forEach(b => b.addEventListener("click", () => goal.set(Number(b.dataset.goal))));

$("#note").innerHTML = `<b>계산 기준</b> · 1개 남는 돈 = 판매가 ÷ ${1 + VAT} (부가세 ${VAT * 100}% 뺀 금액) − 원가, ${R.useYear}년 기준<br>
  필요 개수 = (목표 + 월 고정비) ÷ 1개 남는 돈, 올림. 카드수수료와 종합소득세는 빠진 금액이라 실제로는 조금 더 팔아야 해요.`;

Eltin.yearNotice(R, "tax");

Eltin.init();
render();
</script>
</body>
</html>
