<!DOCTYPE html>
<html lang="ko" data-cat="S" data-no="08">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S08 할인이익 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.compare div{background:#fff;border-radius:var(--radius-sm);padding:8px 6px;text-align:center;font-size:12px;color:var(--ink-2)}
.compare div b{display:block;font-size:14px;color:var(--ink);margin-top:2px}
</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>할인이익 계산기</h1>
      <p>할인·쿠폰을 하면 실제로 얼마 남는지, 어디까지 할인하면 손해인지 보여줘요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="field-row">
      <div class="field">
        <label for="price">판매가 <small>부가세 포함</small></label>
        <div class="input-wrap sm"><input id="price" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="priceHint"></div>
      </div>
      <div class="field">
        <label for="cost">1개 원가</label>
        <div class="input-wrap sm"><input id="cost" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="costHint"></div>
      </div>
    </div>
    <div class="field">
      <label>할인 방식</label>
      <div class="seg" role="group" aria-label="할인 방식" style="margin-bottom:10px">
        <button type="button" data-mode="pct" aria-pressed="true">% 할인</button>
        <button type="button" data-mode="won" aria-pressed="false">금액 할인 (쿠폰)</button>
      </div>
      <div class="input-wrap"><input id="disc" type="text" inputmode="decimal" autocomplete="off" value="10"><span class="unit" id="discUnit">%</span></div>
      <div class="hint" id="discHint"></div>
    </div>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== S08 할인이익 계산기 ===== */
const CONFIG = { rates: { 2026: { vatRate: 0.10 } }, compare: [10, 20, 30] };   // 부가가치세율 10% (부가가치세법 제30조), 연도별로 나눠 둠
const R = Eltin.yearRates(CONFIG.rates), VAT = R.values.vatRate;
const { $, $$, won, num, toNum, koreanUnit, moneyInput, pick, ACTIONS, bindActions, postHeight } = Eltin;

let mode = "pct";
const price = moneyInput($("#price"), $("#priceHint"), render);
const cost = moneyInput($("#cost"), $("#costHint"), render);
const discEl = $("#disc");

/* 1개 남는 돈 = 판매가 ÷ (1 + 부가세율) − 원가 (할인 후 판매가에도 부가세가 붙음) */
const profitAt = (p, c) => p / (1 + VAT) - c;

function render(){
  const p = price.value, c = cost.value, dv = toNum(discEl.value);
  $("#discHint").textContent = mode === "won" ? koreanUnit(dv) : "";
  if(!p || !c){ $("#result").innerHTML = '<p class="empty">판매가와 원가를 넣으면 바로 계산돼요</p>'; postHeight(); return; }
  const base = profitAt(p, c);
  if(base <= 0){ $("#result").innerHTML = '<p class="empty">할인 전에도 남는 돈이 없어요. 원가나 판매가를 확인해 주세요</p>'; postHeight(); return; }

  const newPrice = mode === "pct" ? p * (1 - Math.min(dv, 100) / 100) : Math.max(p - dv, 0);
  const pctOff = (p - newPrice) / p * 100;
  const now = profitAt(newPrice, c);
  const maxPct = (1 - c * (1 + VAT) / p) * 100;     // 남는 돈이 0이 되는 할인율
  const need = now > 0 ? base / now : 0;

  $("#result").innerHTML = `
    <p class="lead">${now > 0 ? `${num(pctOff, 1)}% 할인하면 1개에 남는 돈은` : `${num(pctOff, 1)}% 할인하면 1개 팔 때마다 손해예요`}</p>
    <p class="big ${now > 0 ? "" : "neg"}">${now < 0 ? "− " : ""}${won(Math.abs(now))}<small>원</small></p>
    <div class="rows">
      <div class="row"><span>할인 후 판매가</span><b>${won(newPrice)}원</b></div>
      <div class="row"><span>할인 전 남는 돈</span><b>${won(base)}원</b></div>
      <div class="row"><span>할인 후 남는 돈</span><b class="${now > 0 ? "" : "neg"}">${won(now)}원</b></div>
      <div class="row total"><span>손해 안 보는 최대 할인</span><b>${num(maxPct, 1)}% (${won(p * maxPct / 100)}원)</b></div>
    </div>
    ${now > 0 ? `<p class="tip">할인 전과 같은 돈을 벌려면 <b>${num(need, 1)}배</b> 팔아야 해요. 평소 100개 팔았다면 <b>${won(Math.ceil(100 * need))}개</b>를 팔아야 같아요.</p>`
      : `<p class="tip warn">할인율이 ${num(maxPct, 1)}%를 넘으면 팔수록 손해예요. 인건비·월세는 아직 빼지 않은 금액이에요.</p>`}
    <div class="compare">${CONFIG.compare.map(x => { const v = profitAt(p * (1 - x / 100), c);
      return `<div>${x}% 할인<b class="${v > 0 ? "" : "neg"}">${won(v)}원</b></div>`; }).join("")}</div>
    ${ACTIONS}`;
  bindActions(`[할인이익 계산] 판매가 ${won(p)}원, 원가 ${won(c)}원, ${num(pctOff, 1)}% 할인 → 1개 남는 돈 ${won(base)}원 → ${won(now)}원, 최대 할인 ${num(maxPct, 1)}%`,
    () => { price.set(0); cost.set(0); discEl.value = mode === "pct" ? "10" : ""; render(); $("#price").focus(); });
  postHeight();
}

discEl.addEventListener("input", () => {
  if(mode === "won"){ const n = toNum(discEl.value); discEl.value = n ? won(n) : ""; }
  else discEl.value = discEl.value.replace(/[^\d.]/g, "");
  render();
});
pick($$(".seg button"), b => {
  mode = b.dataset.mode;
  $("#discUnit").textContent = mode === "pct" ? "%" : "원";
  discEl.inputMode = mode === "pct" ? "decimal" : "numeric";
  discEl.value = mode === "pct" ? "10" : "1,000";
  render();
});
discEl.addEventListener("focus", () => discEl.select());

$("#note").innerHTML = `<b>계산 기준</b> · 남는 돈 = 판매가 ÷ ${1 + VAT} (부가세 ${VAT * 100}% 뺀 금액) − 1개 원가, ${R.useYear}년 기준<br>
  할인 후 금액에도 부가세가 붙는다고 보고 계산해요. 인건비·월세 같은 운영비는 빠진 금액이에요.`;

Eltin.yearNotice(R, "tax");

Eltin.init();
render();
</script>
</body>
</html>
