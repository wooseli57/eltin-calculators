<!DOCTYPE html>
<html lang="ko" data-cat="L" data-no="01">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L01 인건비 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>
.adv{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.adv summary{font-size:13px;color:var(--ink-2);cursor:pointer;list-style:none}
.adv summary::before{content:"▸ ";color:var(--brand)}
.adv[open] summary::before{content:"▾ "}
.adv .field{margin-top:10px}
.pct-wrap{width:140px}
.row.fold{cursor:pointer}
.row.fold span::after{content:" ▾";font-size:11px;color:var(--ink-3)}
.row.fold.open span::after{content:" ▴"}
.row.sub{font-size:13px;padding:7px 0 7px 12px}
.row.sub span:first-child{color:var(--ink-3)}
</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>인건비 계산기</h1>
      <p>시급과 근무시간을 넣으면 월 급여와 사장님이 내는 4대보험료까지 한 번에 알려줘요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="seg" role="group" aria-label="고용 형태" id="typeSeg">
      <button type="button" data-type="ins" aria-pressed="true">4대보험 가입</button>
      <button type="button" data-type="free" aria-pressed="false">3.3% 프리랜서</button>
    </div>
    <div class="field">
      <label for="wage">시급</label>
      <div class="input-wrap"><input id="wage" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
      <div class="hint" id="wageHint"></div>
    </div>
    <div class="field">
      <label for="hours">하루 근무시간 <small>쉬는 시간 빼고</small></label>
      <div class="input-wrap"><input id="hours" type="text" inputmode="decimal" autocomplete="off" value="8"><span class="unit">시간</span></div>
    </div>
    <div class="field">
      <label>일주일에 일하는 날</label>
      <div class="chips" id="dayChips">
        <button class="chip" type="button" data-v="1">1일</button>
        <button class="chip" type="button" data-v="2">2일</button>
        <button class="chip" type="button" data-v="3">3일</button>
        <button class="chip" type="button" data-v="4">4일</button>
        <button class="chip" type="button" data-v="5" aria-pressed="true">5일</button>
        <button class="chip" type="button" data-v="6">6일</button>
        <button class="chip" type="button" data-v="7">7일</button>
      </div>
    </div>
    <div class="field">
      <label>사업장 규모 <small>상시 근로자 수</small></label>
      <div class="seg" role="group" aria-label="사업장 규모" id="sizeSeg">
        <button type="button" data-size="5up" aria-pressed="true">5인 이상</button>
        <button type="button" data-size="5down" aria-pressed="false">5인 미만</button>
      </div>
    </div>
    <details class="adv" id="adv">
      <summary>고급 설정 · 산재보험 요율</summary>
      <div class="field">
        <label for="acc">산재보험 요율 <small>업종에 맞게 바꿀 수 있어요</small></label>
        <div class="input-wrap pct-wrap"><input id="acc" type="text" inputmode="decimal" autocomplete="off"><span class="unit">%</span></div>
      </div>
    </details>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== L01 인건비 계산기 (사양: docs/specs/L01.md) ===== */
const CONFIG = {
  weeksPerMonth: 365 / 7 / 12,
  freelanceRate: 0.033,        // 사업소득세 3% + 지방소득세 0.3%
  rates: {
    2026: {
      minWage: 10320,          // 고용노동부 고시 2026년 적용 최저임금 (확인 2026-11-23)
      pensionEmployer: 0.0475, // 국민연금 9.5%의 1/2 (국민연금법 부칙, 확인 2026-11-23)
      pensionEmployee: 0.0475,
      healthEmployer: 0.03595, // 건강보험 7.19%의 1/2 (확인 2026-11-23)
      healthEmployee: 0.03595,
      ltcRatio: 0.1314,        // 장기요양 = 건강보험료 × 13.14% (확인 2026-11-23)
      empEmployer: 0.0115,     // 실업급여 0.9% + 고용안정·직능개발 0.25%(150인 미만) (고용노동부, 확인 2026-11-23)
      empEmployee: 0.009,
      accidentAvg: 0.0147      // 2026년 평균 산재보험료율 (고용노동부 발표, 확인 2026-11-23)
    },
    2027: {
      minWage: 10700,          // 고용노동부 2027년 적용 최저임금 고시 2026-08-05 (확인 2026-11-23)
      pensionEmployer: 0.05,   // 국민연금 10% (매년 0.5%p 인상 일정, 1월 시행 시 재확인)
      pensionEmployee: 0.05,
      healthEmployer: 0.03595, // 2027년 건강보험료율 7.19% 동결 (보건복지부 2026-09-08)
      healthEmployee: 0.03595
      // ltcRatio, empEmployer, empEmployee, accidentAvg: 2027년 고시 확인 전 → 2026년 값 사용
    }
  }
};
const R = Eltin.yearRates(CONFIG.rates), V = R.values;
const { $, $$, won, num, moneyInput, numInput, pick, ACTIONS, bindActions, postHeight } = Eltin;

let type = "ins", days = 5, big5 = true, open = false;
$("#wage").value = won(V.minWage);
$("#acc").value = +(V.accidentAvg * 100).toFixed(3);
const wage = moneyInput($("#wage"), $("#wageHint"), render);
const hours = numInput($("#hours"), render), acc = numInput($("#acc"), render);

/* 2026-11-25 개정: 1~6일째는 평일·토요일 근무(hW), 7일째는 주휴일 근무로 보고 휴일근로(hH).
   5인 이상만 가산: 연장 = 주 40시간 넘는 hW × 50%, 휴일 = 8시간 이내 50% + 넘는 시간 100% (근로기준법 제56조).
   휴일근로 시간은 연장 가산과 겹쳐 계산하지 않고, 주휴 계산에도 넣지 않음 */
function calc(){
  const w = wage.value, d = hours.value, W = CONFIG.weeksPerMonth;
  const hW = d * Math.min(days, 6), hH = days === 7 ? d : 0, h = hW + hH;
  const otH = big5 ? Math.max(hW - 40, 0) : 0;                        // 연장 가산 시간(주)
  const hol8 = big5 ? Math.min(hH, 8) : 0, holOver = big5 ? Math.max(hH - 8, 0) : 0;
  const base = Math.round(w * h * W);                                  // 모든 근무시간 × 시급
  const ot = Math.round(w * 0.5 * otH * W);
  const holWork = Math.round((w * 0.5 * hol8 + w * holOver) * W);
  const holidayH = hW >= 15 ? Math.min(hW, 40) / 40 * 8 : 0;          // 주휴시간
  const holiday = Math.round(w * holidayH * W);
  const pay = base + ot + holWork + holiday;                           // 월급 합계(세전)
  const f = Math.floor;
  const ins = {
    pension: f(pay * V.pensionEmployer),
    health:  f(pay * V.healthEmployer),
    emp:     f(pay * V.empEmployer),
    acc:     f(pay * acc.value / 100)
  };
  ins.ltc = f(ins.health * V.ltcRatio);
  const insSum = ins.pension + ins.health + ins.ltc + ins.emp + ins.acc;
  const healthE = f(pay * V.healthEmployee);
  const workerDed = f(pay * V.pensionEmployee) + healthE + f(healthE * V.ltcRatio) + f(pay * V.empEmployee);
  const withhold = f(pay * CONFIG.freelanceRate);
  return { w, h, hW, hH, otH, hol8, holOver, base, ot, holWork, holiday, holidayH, pay, ins, insSum, workerDed, withhold };
}

function render(){
  const c = calc();
  if(!c.w || !c.h){ $("#result").innerHTML = '<p class="empty">시급과 근무시간을 넣으면 바로 계산돼요</p>'; postHeight(); return; }
  const low = c.w < V.minWage ? `<p class="tip warn" style="margin:0 0 10px">입력한 시급이 ${R.useYear}년 최저임금(${won(V.minWage)}원)보다 낮아요.</p>` : "";
  const noHoliday = c.hW < 15 ? `<p class="tip">주 ${num(c.hW, 1)}시간으로 주 15시간 미만이라 주휴수당이 없어요.</p>` : "";
  const over52 = big5 && c.h > 52 ? `<p class="tip warn" style="margin:0 0 10px">주 52시간(기본 40시간 + 연장 12시간)을 넘어요. 5인 이상 사업장은 법정 한도를 넘는 근무를 시킬 수 없어요.</p>` : "";
  const lawTips = (days === 7 ? `<p class="tip">7일째는 주휴일에 일한 것으로 보고 휴일근로로 계산했어요. 주휴일 근무가 계속되지 않도록 쉬는 날을 정해 주세요.</p>` : "")
    + (!big5 ? `<p class="tip">5인 미만 사업장은 연장·휴일근로 가산수당이 법적 의무가 아니라 넣지 않았어요. 근로계약서에 정했다면 그대로 지급해야 해요.</p>` : "");
  const sm = t => `<small>${t}</small>`;
  const holSub = `매주 ${num(c.holidayH, 1)}시간분 × 월 평균 ${num(CONFIG.weeksPerMonth, 3)}주`;
  const otRow = c.ot ? `<div class="row"><span>연장근로 가산${sm(`주 ${num(c.otH, 1)}시간 × 시급의 50%`)}</span><b>${won(c.ot)}원</b></div>` : "";
  const holRow = c.holWork ? `<div class="row"><span>휴일근로 가산${sm(`주 ${num(c.hol8, 1)}시간 × 시급의 50%${c.holOver ? ` + 주 ${num(c.holOver, 1)}시간 × 시급의 100%` : ""}`)}</span><b>${won(c.holWork)}원</b></div>` : "";
  let total, rows, tips;

  if(type === "ins"){
    total = c.pay + c.insSum;
    const take = c.pay - c.workerDed;
    rows = `
      <div class="row"><span>근무시간분 급여${sm(`주 ${num(c.h, 1)}시간 × 시급`)}</span><b>${won(c.base)}원</b></div>
      ${otRow}${holRow}
      <div class="row"><span>주휴수당${c.holidayH ? sm(holSub) : ""}</span><b>${won(c.holiday)}원</b></div>
      <div class="row"><span>월급 합계 (세전)</span><b>${won(c.pay)}원</b></div>
      <div class="row fold ${open ? "open" : ""}" id="fold" role="button" tabindex="0" aria-expanded="${open}"><span>사장님 부담 4대보험</span><b>${won(c.insSum)}원</b></div>
      ${open ? [["국민연금", c.ins.pension], ["건강보험", c.ins.health], ["장기요양", c.ins.ltc], ["고용보험", c.ins.emp], ["산재보험", c.ins.acc]]
        .map(([n, v]) => `<div class="row sub"><span>${n}</span><b>${won(v)}원</b></div>`).join("") : ""}
      <div class="row total"><span>사장님 총부담</span><b>${won(total)}원</b></div>`;
    tips = `<p class="tip">직원이 실제로 받는 돈은 약 <b>${won(take)}원</b>이에요 (소득세 제외).</p>${noHoliday}${lawTips}`;
  } else {
    total = c.pay;
    rows = `
      <div class="row"><span>월급 합계${sm(c.ot || c.holWork ? "근무시간분 + 가산수당 + 주휴수당" : c.holiday ? "주휴수당 포함" : "근무시간분")}</span><b>${won(c.pay)}원</b></div>
      <div class="row"><span>원천징수 3.3%</span><b>− ${won(c.withhold)}원</b></div>
      <div class="row"><span>직원 실수령액</span><b>${won(c.pay - c.withhold)}원</b></div>
      <div class="row total"><span>사장님 총부담</span><b>${won(total)}원</b></div>`;
    tips = `<p class="tip">직원이 실제로 받는 돈은 약 <b>${won(c.pay - c.withhold)}원</b>이에요.</p>${noHoliday}
      <p class="tip warn">출퇴근 시간이 정해져 있고 지시를 받으며 일하면 근로자로 보여 4대보험 가입 의무가 생길 수 있어요.</p>${lawTips}`;
  }

  $("#result").innerHTML = `${low}${over52}
    <p class="lead">직원 1명에게 한 달에 드는 돈은</p>
    <p class="big">${won(total)}<small>원</small></p>
    <div id="chart"></div>
    <div class="rows">${rows}</div>
    ${tips}
    ${ACTIONS}`;
  const fold = $("#fold");
  if(fold){ const t = () => { open = !open; render(); }; fold.onclick = t; fold.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); t(); } }; }
  Eltin.donut($("#chart"), type === "ins" ? [{ label: "월급 (세전)", value: c.pay }, { label: "국민연금", value: c.ins.pension }, { label: "건강보험", value: c.ins.health }, { label: "장기요양", value: c.ins.ltc }, { label: "고용보험", value: c.ins.emp }, { label: "산재보험", value: c.ins.acc }] : [], { big: `${num(c.insSum / total * 100, 1)}%`, small: "4대보험 비중" }, { profitLast: false });
  bindActions(type === "ins"
    ? `[인건비 계산] 시급 ${won(c.w)}원, 주 ${num(c.h, 1)}시간 → 월급 ${won(c.pay)}원(주휴 ${won(c.holiday)}원 포함) + 사장님 4대보험 ${won(c.insSum)}원 = 총부담 ${won(total)}원 (${R.useYear}년 기준)`
    : `[인건비 계산] 시급 ${won(c.w)}원, 주 ${num(c.h, 1)}시간, 3.3% 프리랜서 → 월급 ${won(c.pay)}원, 원천징수 ${won(c.withhold)}원, 실수령 ${won(c.pay - c.withhold)}원`,
    () => { wage.set(V.minWage); hours.set(8); setDays(5); acc.set(+(V.accidentAvg * 100).toFixed(3)); });
  postHeight();
}

function setDays(d){ days = d; $$("#dayChips .chip").forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.v) === d)); render(); }
$$("#dayChips .chip").forEach(b => b.addEventListener("click", () => setDays(Number(b.dataset.v))));
pick($$("#sizeSeg button"), b => { big5 = b.dataset.size === "5up"; render(); });
pick($$("#typeSeg button"), b => { type = b.dataset.type; $("#adv").hidden = type !== "ins"; render(); });
$("#adv").addEventListener("toggle", postHeight);

$("#note").innerHTML = `<b>계산 기준</b> · ${R.useYear}년 최저임금·4대보험 요율, 한 달은 평균 ${num(CONFIG.weeksPerMonth, 3)}주로 계산해요. 보험료는 항목마다 원 미만 버림.<br>
  주 15시간 이상이면 주휴수당(주 근무시간 ÷ 40 × 8시간, 최대 8시간)을 자동으로 넣어요. 상시근로자 150인 미만 사업장 기준이에요.<br>
  주 40시간 넘는 근무는 연장근로(5인 이상 50% 가산), 7일째 근무는 휴일근로(5인 이상 8시간 이내 50%, 넘는 시간 100% 가산)로 계산해요. 야간근로(밤 10시~오전 6시) 가산은 L05 가산수당 계산기에서 확인하세요.<br>
  국민연금·건강보험의 월 소득 상·하한은 반영하지 않아 아주 높거나 낮은 급여는 실제와 다를 수 있어요.<br>
  산재보험은 업종마다 요율이 달라요 (기본값은 전체 평균).`;
Eltin.yearNotice(R, "labor", { minWage: "최저임금", pensionEmployer: "국민연금", healthEmployer: "건강보험", ltcRatio: "장기요양", empEmployer: "고용보험", accidentAvg: "산재" });

Eltin.init();
render();
</script>
</body>
</html>
