<!DOCTYPE html>
<html lang="ko" data-cat="O" data-no="06">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O06 실수령 정산 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>
.adv{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.adv summary{font-size:13px;color:var(--ink-2);cursor:pointer;list-style:none}
.adv summary::before{content:"▸ ";color:var(--brand)}
.adv[open] summary::before{content:"▾ "}
.adv .field-row,.adv>.field{margin-top:12px}
.adv .field-row .field{margin-top:0}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;margin-top:12px}
.check input{width:20px;height:20px;accent-color:var(--brand-dark)}
.sel-wrap select{flex:1;border:0;outline:0;font:inherit;font-size:16px;font-weight:700;padding:12px 0;background:transparent;color:var(--ink);min-width:0}
.help{font-size:12px;color:var(--ink-3);margin-top:6px}
</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>실수령 정산 계산기</h1>
      <p>카드·배달앱 수수료를 빼고 실제로 통장에 들어오는 금액을 알려줘요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="field">
      <label for="card">한 달 카드매출</label>
      <div class="input-wrap"><input id="card" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
      <div class="hint" id="cardHint"></div>
    </div>
    <div class="field">
      <label for="cash">한 달 현금·계좌이체 매출</label>
      <div class="input-wrap"><input id="cash" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
      <div class="hint" id="cashHint"></div>
    </div>
    <div class="field">
      <label for="deliv">한 달 배달앱 매출 <small>음식값, 배달팁 제외</small></label>
      <div class="input-wrap"><input id="deliv" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
      <div class="hint" id="delivHint"></div>
    </div>
    <div class="field" id="countBox" hidden>
      <label for="count">한 달 배달 건수</label>
      <div class="input-wrap"><input id="count" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">건</span></div>
    </div>
    <div class="field">
      <label for="tierSel">카드 연매출 구간</label>
      <div class="input-wrap sel-wrap"><select id="tierSel"></select></div>
    </div>
    <div class="field" id="generalBox" hidden>
      <label for="general">일반가맹점 수수료율 <small>예시값, 카드사 안내 요율로</small></label>
      <div class="input-wrap"><input id="general" type="text" inputmode="decimal" autocomplete="off"><span class="unit">%</span></div>
    </div>

    <details class="adv" id="adv">
      <summary>수수료 설정 · 배달 수수료, 체크카드 비중</summary>
      <div class="field-row">
        <div class="field">
          <label for="broker">중개수수료율</label>
          <div class="input-wrap sm"><input id="broker" type="text" inputmode="decimal" autocomplete="off"><span class="unit">%</span></div>
        </div>
        <div class="field">
          <label for="pay">결제수수료율</label>
          <div class="input-wrap sm"><input id="pay" type="text" inputmode="decimal" autocomplete="off"><span class="unit">%</span></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="perFee">건당 배달비 <small>사장님 부담</small></label>
          <div class="input-wrap sm"><input id="perFee" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
          <div class="hint" id="perFeeHint"></div>
        </div>
        <div class="field">
          <label for="check">체크카드 비중</label>
          <div class="input-wrap sm"><input id="check" type="text" inputmode="decimal" autocomplete="off" value="0"><span class="unit">%</span></div>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="vat" checked> 배달 수수료에 부가세(10%) 포함</label>
      <p class="help">배달 수수료는 예시값이에요. 내 가게 정산서의 실제 값으로 바꿔주세요.</p>
    </details>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== O06 실수령 정산 계산기 (사양: docs/specs/O06.md) ===== */
/* 카드 구간표는 assets/eltin-calc.js의 Eltin.cardTiers에서만 관리 (O02와 공통) */
const CONFIG = {
  delivery: { brokerRate: 7.8, payRate: 3.0 },   // 예시값: S03과 같은 근거 (확인 2026-11-23)
  feeVat: 1.1
};
const CT = Eltin.cardTiers, R = Eltin.yearRates(CT.rates), V = R.values;
const { $, won, num, moneyInput, numInput, ACTIONS, bindActions, postHeight } = Eltin;

$("#tierSel").innerHTML = V.tiers.map((t, i) => `<option value="${i}">${t.name}</option>`).join("");
$("#general").value = CT.generalRateExample;
$("#broker").value = CONFIG.delivery.brokerRate; $("#pay").value = CONFIG.delivery.payRate;
const card = moneyInput($("#card"), $("#cardHint"), render);
const cash = moneyInput($("#cash"), $("#cashHint"), render);
const deliv = moneyInput($("#deliv"), $("#delivHint"), render);
const perFee = moneyInput($("#perFee"), $("#perFeeHint"), render);
const count = numInput($("#count"), render), general = numInput($("#general"), render);
const broker = numInput($("#broker"), render), pay = numInput($("#pay"), render), check = numInput($("#check"), render);
["#tierSel", "#vat"].forEach(s => $(s).addEventListener("change", render));
$("#adv").addEventListener("toggle", postHeight);

const floor = x => Math.floor(x + 1e-6);   // 원 미만 버림 (부동소수 오차 보정)

/* 실수령액 = 총매출 − 카드수수료 − 배달 수수료 − 배달비
   배달 수수료 = 배달앱 매출 × (중개율 + 결제율) × 부가세, 배달비 = 건당 배달비 × 건수 */
function render(){
  const tier = V.tiers[$("#tierSel").value];
  $("#generalBox").hidden = tier.credit != null;
  $("#countBox").hidden = !deliv.value;
  const c = card.value, ca = cash.value, d = deliv.value;
  const total = c + ca + d;
  if(!total){ $("#result").innerHTML = '<p class="empty">한 달 매출을 넣으면 바로 계산돼요</p>'; postHeight(); return; }
  if(tier.credit == null && !general.value){ $("#result").innerHTML = '<p class="empty">일반가맹점 수수료율을 넣어주세요</p>'; postHeight(); return; }

  const cardFee = c ? CT.fee(c, Math.min(check.value, 100) / 100, tier, general.value).total : 0;
  const vat = $("#vat").checked ? CONFIG.feeVat : 1;
  const delivFee = floor(d * (broker.value + pay.value) / 100 * vat);
  const delivCost = d ? floor(perFee.value * count.value) : 0;
  const costs = cardFee + delivFee + delivCost;
  const net = total - costs;
  const ratio = costs / total * 100;
  const rows = [["총매출", total], ["카드수수료", -cardFee], ["배달 수수료", -delivFee], ["배달비", -delivCost]];

  $("#result").innerHTML = `
    <p class="lead">한 달에 통장에 들어오는 돈은</p>
    <p class="big">${won(net)}<small>원</small></p>
    <div id="chart"></div>
    <div class="rows">
      ${rows.filter(([, v]) => v).map(([k, v]) => `<div class="row"><span>${k}</span><b>${v < 0 ? "− " : ""}${won(Math.abs(v))}원</b></div>`).join("")}
      <div class="row"><span>매출 대비 수수료 비율</span><b>${num(ratio, 1)}%</b></div>
      <div class="row total"><span>실수령액</span><b>${won(net)}원</b></div>
    </div>
    ${d && !perFee.value ? `<p class="tip">배달비가 있으면 수수료 설정에서 건당 배달비를 넣어주세요.</p>` : ""}
    <p class="tip">부가세·소득세, 광고비, 쿠폰 부담분은 빠진 금액이에요. 세금은 세금 계산기(O05)에서 확인하세요.</p>
    ${ACTIONS}`;
  Eltin.donut($("#chart"), [{ label: "카드수수료", value: cardFee }, { label: "배달 수수료", value: delivFee }, { label: "배달비", value: delivCost }, { label: "실수령액", value: net }], { big: `${num(ratio, 1)}%`, small: "매출 중 수수료" }, { loss: net < 0 ? `수수료가 매출보다 ${won(-net)}원 많아요` : "" });
  bindActions(`[실수령 정산] 총매출 ${won(total)}원 − 카드수수료 ${won(cardFee)}원 − 배달 수수료 ${won(delivFee)}원 − 배달비 ${won(delivCost)}원 = 실수령 ${won(net)}원 (수수료 ${num(ratio, 1)}%)`,
    () => { card.set(0); cash.set(0); deliv.set(0); count.set(""); perFee.set(0); check.set(0); $("#card").focus(); });
  postHeight();
}

$("#note").innerHTML = `<b>계산 기준</b> · 카드수수료는 ${V.period} 우대수수료율 기준(체크카드 비중 기본 0%), 배달 수수료는 입력한 요율 기준이에요. 금액마다 원 미만 버림.`;
Eltin.yearNotice(R, "", {}, `${R.useYear}년 기준이에요. 카드 우대수수료율은 매년 2월·8월에 매출 구간이 다시 정해지고, 배달앱 수수료와 배달비는 앱마다 다르며 가게의 매출 구간, 가게와 손님 사이의 거리, 앱의 정책에 따라 수시로 바뀌어요. 배달 수수료 기본값은 예시예요. 참고용으로 사용하시고, 정확한 금액은 카드사·여신금융협회와 각 배달앱 정산서를 확인하세요.`);

Eltin.init();
render();
</script>
</body>
</html>
