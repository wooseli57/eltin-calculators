<!DOCTYPE html>
<html lang="ko" data-cat="T" data-no="07">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T07 시재 정산 계산기 | 엘틴 소상공인 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/eltin-calc.css">
<style>
.cash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.cash label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:6px 10px;background:#fff;min-width:0}
.cash label:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cash span{flex:none;font-size:13px;font-weight:700;color:var(--ink-2);min-width:52px}
.cash input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:17px;font-weight:700;text-align:right;padding:6px 0;background:transparent;color:var(--ink)}
.cash em{font-style:normal;font-size:12px;color:var(--ink-3)}
.cash-sum{font-size:12px;color:var(--ink-3);text-align:right;margin-top:6px}
</style>
</head>
<body>
<main class="calc">
  <header class="calc-head">
    <div>
      <span class="tag"></span>
      <h1>시재 정산 계산기</h1>
      <p>마감할 때 지폐·동전 개수를 넣으면 현금 합계와 과부족을 알려줘요</p>
    </div>
    <div class="head-side"></div>
  </header>

  <section class="card" aria-label="입력">
    <div class="field">
      <label>금고에 있는 현금 <small>장·개 수</small></label>
      <div class="cash" id="cash"></div>
      <div class="cash-sum" id="cashSum"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="start">시작 준비금</label>
        <div class="input-wrap sm"><input id="start" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="startHint"></div>
      </div>
      <div class="field">
        <label for="sales">오늘 현금 매출 <small>POS</small></label>
        <div class="input-wrap sm"><input id="sales" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="unit">원</span></div>
        <div class="hint" id="salesHint"></div>
      </div>
    </div>
  </section>

  <section class="result" aria-live="polite" id="result"></section>
  <p class="note" id="note"></p>
  <nav class="cta" id="cta"></nav>
  <p class="brand-foot">엘틴 소상공인 무료 계산기</p>
  <div class="dev" id="dev" hidden></div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/eltin-calc.js"></script>
<script>
/* ===== T07 시재 정산 계산기 ===== */
const { $, $$, won, toNum, moneyInput, ACTIONS, bindActions, postHeight } = Eltin;

const DENOMS = [50000, 10000, 5000, 1000, 500, 100, 50, 10];
$("#cash").innerHTML = DENOMS.map(d => `<label><span>${won(d)}원</span><input type="text" inputmode="numeric" autocomplete="off" placeholder="0" data-d="${d}" aria-label="${won(d)}원 개수"><em>${d >= 1000 ? "장" : "개"}</em></label>`).join("");
const counts = () => [...$$("#cash input")].map(i => ({ d: Number(i.dataset.d), n: toNum(i.value) }));
$$("#cash input").forEach(i => i.addEventListener("input", () => { i.value = i.value.replace(/\D/g, ""); render(); }));

const start = moneyInput($("#start"), $("#startHint"), render);
const sales = moneyInput($("#sales"), $("#salesHint"), render);

/* 현금 합계 = Σ 권종 × 개수, 있어야 할 돈 = 시작 준비금 + 오늘 현금 매출, 과부족 = 현금 합계 − 있어야 할 돈 */
function render(){
  const list = counts().filter(c => c.n);
  const cash = list.reduce((s, c) => s + c.d * c.n, 0);
  $("#cashSum").textContent = cash ? `현금 합계 ${won(cash)}원` : "";
  if(!cash){ $("#result").innerHTML = '<p class="empty">지폐·동전 개수를 넣으면 바로 합해요</p>'; postHeight(); return; }

  const expected = start.value + sales.value;
  const hasExp = expected > 0, diff = cash - expected;
  const bills = list.filter(c => c.d >= 1000).reduce((s, c) => s + c.d * c.n, 0);

  $("#result").innerHTML = `
    <p class="lead">${!hasExp ? "금고 현금 합계는" : diff === 0 ? "딱 맞아요! 현금 합계는" : diff > 0 ? "현금이 남아요 (과잉)" : "현금이 모자라요 (부족)"}</p>
    <p class="big ${hasExp && diff < 0 ? "neg" : ""}">${hasExp && diff !== 0 ? `${diff > 0 ? "+" : "−"}${won(Math.abs(diff))}` : won(cash)}<small>원</small></p>
    <div class="rows">
      ${list.map(c => `<div class="row"><span>${won(c.d)}원 × ${won(c.n)}</span><b>${won(c.d * c.n)}원</b></div>`).join("")}
      <div class="row total"><span>현금 합계</span><b>${won(cash)}원</b></div>
      ${hasExp ? `<div class="row"><span>있어야 할 돈 (준비금 + 현금 매출)</span><b>${won(expected)}원</b></div>
      <div class="row total"><span>과부족</span><b class="${diff < 0 ? "neg" : ""}">${diff > 0 ? "+" : diff < 0 ? "−" : ""}${won(Math.abs(diff))}원</b></div>` : ""}
    </div>
    ${hasExp && start.value ? `<p class="tip">내일 준비금 ${won(start.value)}원을 남기면 입금할 돈은 <b>${won(Math.max(cash - start.value, 0))}원</b>이에요. (지폐 ${won(bills)}원 · 동전 ${won(cash - bills)}원)</p>` : ""}
    ${ACTIONS}`;
  bindActions(`[시재 정산] 현금 합계 ${won(cash)}원${hasExp ? `, 있어야 할 돈 ${won(expected)}원, 과부족 ${diff > 0 ? "+" : diff < 0 ? "−" : ""}${won(Math.abs(diff))}원` : ""}`,
    () => { $$("#cash input").forEach(i => i.value = ""); start.set(0); sales.set(0); });
  postHeight();
}

$("#note").innerHTML = `<b>계산 기준</b> · 현금 합계 = 권종 × 개수의 합, 있어야 할 돈 = 시작 준비금 + 오늘 현금 매출(POS), 과부족 = 현금 합계 − 있어야 할 돈<br>
  현금 환불이나 현금으로 낸 지출이 있었다면 현금 매출에서 빼고 넣어주세요.`;

Eltin.init();
render();
</script>
</body>
</html>
